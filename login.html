<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Provider | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #030303; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 17, 26, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .bg-neon-grad { background: linear-gradient(135deg, #A855F7 0%, #3B82F6 100%); }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative">
    <div class="glass w-[90%] max-w-sm rounded-[32px] p-8 z-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black">Welcome</h1>
            <p class="text-xs text-gray-400 mt-2">Login or Create Account</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full bg-[#0F111A] border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full bg-[#0F111A] border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
            <button id="authBtn" class="w-full bg-neon-grad text-white font-black py-3 rounded-xl">Login / Register</button>
            <p id="msg" class="text-red-400 text-xs text-center hidden"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCQ8323U6o9UkptArtel1YNtV-BgaZQJQ",
            authDomain: "provider-46c14.firebaseapp.com",
            databaseURL: "https://provider-46c14-default-rtdb.firebaseio.com",
            projectId: "provider-46c14",
            storageBucket: "provider-46c14.firebasestorage.app",
            messagingSenderId: "1032460066158",
            appId: "1:1032460066158:web:8a52fb3c0651169c55f57f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        document.getElementById('authBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (e) {
                try {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await set(ref(db, 'users/' + res.user.uid), { email, balance: 0, createdAt: Date.now() });
                    window.location.href = 'index.html';
                } catch (err) {
                    msg.innerText = err.message;
                    msg.classList.remove('hidden');
                }
            }
        };
    </script>
</body>
</html>
