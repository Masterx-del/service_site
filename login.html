<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Top Provider</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
    body{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .auth-card{background:#1e1e2e;border-radius:20px;padding:30px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.4);border:1px solid #333}
    .logo{text-align:center;margin-bottom:25px}
    .logo img{width:60px;height:60px;border-radius:50%;border:3px solid #6366f1}
    .logo h2{color:#fff;margin-top:10px;font-size:1.3rem}
    .auth-tabs{display:flex;margin-bottom:20px;background:#2a2a3e;border-radius:12px;padding:4px}
    .auth-tab{flex:1;padding:10px;text-align:center;border-radius:10px;cursor:pointer;font-weight:500;color:#aaa;transition:0.3s}
    .auth-tab.active{background:#6366f1;color:#fff}
    .input-group{margin-bottom:18px}
    .input-group label{display:block;color:#aaa;margin-bottom:8px;font-size:0.9rem}
    .input-group input{width:100%;padding:12px 15px;background:#2a2a3e;border:1px solid #3a3a5a;border-radius:10px;color:#fff;font-size:1rem;outline:none;transition:0.3s}
    .input-group input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.2)}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:0.3s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(99,102,241,0.4)}
    .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .error{color:#f87171;background:#3f2323;padding:10px;border-radius:8px;margin-bottom:15px;font-size:0.9rem;display:none}
    .success{color:#10b981;background:#1a3f2e;padding:10px;border-radius:8px;margin-bottom:15px;font-size:0.9rem;display:none}
    .footer{text-align:center;margin-top:25px;color:#666;font-size:0.85rem}
    .footer a{color:#6366f1;text-decoration:none}
    .loader{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin 1s linear infinite;margin:10px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .form-section{display:none}
    .form-section.active{display:block}
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Logo"/>
      <h2>Top Provider</h2>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">Login</div>
      <div class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    
    <!-- LOGIN FORM -->
    <form id="loginForm" class="form-section active">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required/>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password" required/>
      </div>
      <button type="submit" class="btn" id="loginBtn">Login</button>
      <div class="loader" id="loginLoader"></div>
      <div class="footer"><a href="#" onclick="forgotPassword();return false;">Forgot Password?</a></div>
    </form>
    
    <!-- SIGNUP FORM -->
    <form id="signupForm" class="form-section">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Enter your name" required/>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" required/>
      </div>
      <div class="input-group">
        <label>Phone (Optional)</label>
        <input type="tel" id="signupPhone" placeholder="+91 XXXXX XXXXX"/>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signupPass" placeholder="Min 6 characters" minlength="6" required/>
      </div>
      <div class="input-group">
        <label>Referral Code (Optional)</label>
        <input type="text" id="refCode" placeholder="Enter referrer's code"/>
      </div>
      <button type="submit" class="btn" id="signupBtn">Create Account</button>
      <div class="loader" id="signupLoader"></div>
      <div class="footer"><p>Already have account? <a href="#" onclick="switchTab('login');return false;">Login</a></p></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
      onAuthStateChanged, sendPasswordResetEmail, updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getDatabase, ref, set, get, push, update, query, orderByChild, equalTo 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCQ8323U6o9UkptArtel1YNtV-BgaZQJQ",
      authDomain: "provider-46c14.firebaseapp.com",
      databaseURL: "https://provider-46c14-default-rtdb.firebaseio.com",
      projectId: "provider-46c14",
      storageBucket: "provider-46c14.firebasestorage.app",
      messagingSenderId: "1032460066158",
      appId: "1:1032460066158:web:8a52fb3c0651169c55f57f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; setTimeout(()=>errorMsg.style.display='none',5000); }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; setTimeout(()=>successMsg.style.display='none',4000); }
    function setLoading(form, loading) {
      document.getElementById(form+'Btn').disabled = loading;
      document.getElementById(form+'Loader').style.display = loading ? 'block' : 'none';
    }

    window.switchTab = function(tab) {
      document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f=>f.classList.remove('active'));
      if(tab==='login'){document.querySelectorAll('.auth-tab')[0].classList.add('active');document.getElementById('loginForm').classList.add('active');}
      else{document.querySelectorAll('.auth-tab')[1].classList.add('active');document.getElementById('signupForm').classList.add('active');}
      errorMsg.style.display='none';successMsg.style.display='none';
    }

    // 🔹 SIGNUP - ANY USER CAN SIGN UP
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPass').value;
      const refCode = document.getElementById('refCode').value.trim();
      
      setLoading('signup', true); errorMsg.style.display='none';

      try {
        // 1. Create Auth User
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        await updateProfile(user, { displayName: name });
        
        // 2. Generate referral code
        const myRef = user.uid.substring(0,8);
        
        // 3. Save to RTDB - USER CAN WRITE THEIR OWN DATA
        await set(ref(db, `users/${user.uid}`), {
          uid: user.uid, name, email, phone: phone||null, balance: 0,
          referralCode: myRef, referredBy: refCode||null,
          createdAt: Date.now(), lastLogin: Date.now(), isActive: true,
          affiliate: { totalEarned:0, todayEarned:0, totalReferrals:0, activeReferrals:0 },
          stats: { totalOrders:0, completed:0, active:0, cancelled:0, totalSpent:0 }
        });
        
        // 4. Handle referral if any
        if(refCode) {
          const usersSnap = await get(ref(db,'users'));
          let referrer = null;
          usersSnap.forEach(c=>{ const u=c.val(); if(u.referralCode===refCode) referrer={uid:c.key,...u}; });
          if(referrer) {
            await update(ref(db,`users/${referrer.uid}/affiliate`), {
              totalReferrals: (referrer.affiliate?.totalReferrals||0)+1,
              activeReferrals: (referrer.affiliate?.activeReferrals||0)+1
            });
            await push(ref(db,`referrals/${referrer.uid}`), { referredUid:user.uid, referredEmail:email, timestamp:Date.now() });
          }
        }
        
        showSuccess('✅ Account created! Redirecting...');
        setTimeout(()=>{
          localStorage.setItem('userSession', JSON.stringify({uid:user.uid,email,name,loggedIn:true,timestamp:Date.now()}));
          window.location.href='index.html';
        },1500);
      } catch(err) {
        console.error(err);
        let msg='Signup failed';
        if(err.code==='auth/email-already-in-use') msg='Email already registered';
        else if(err.code==='auth/weak-password') msg='Password min 6 characters';
        else if(err.code==='auth/invalid-email') msg='Invalid email';
        else if(err.code==='auth/network-request-failed') msg='Network error';
        else if(err.code==='permission-denied') msg='Database access denied - Contact admin to fix Firebase rules';
        showError(msg); setLoading('signup',false);
      }
    });

    // 🔹 LOGIN - ANY USER CAN LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;
      setLoading('login',true); errorMsg.style.display='none';

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        
        // Ensure user data exists in RTDB
        const snap = await get(ref(db,`users/${user.uid}`));
        if(!snap.exists()) {
          await set(ref(db,`users/${user.uid}`), {
            uid:user.uid, name:user.displayName||email.split('@')[0], email, balance:0,
            referralCode:user.uid.substring(0,8), createdAt:Date.now(), lastLogin:Date.now(), isActive:true,
            affiliate:{totalEarned:0,todayEarned:0,totalReferrals:0,activeReferrals:0},
            stats:{totalOrders:0,completed:0,active:0,cancelled:0,totalSpent:0}
          });
        } else {
          await update(ref(db,`users/${user.uid}`), { lastLogin:Date.now() });
        }
        
        showSuccess('✅ Login successful!');
        setTimeout(()=>{
          localStorage.setItem('userSession', JSON.stringify({uid:user.uid,email,name:user.displayName||email.split('@')[0],loggedIn:true,timestamp:Date.now()}));
          window.location.href='index.html';
        },1200);
      } catch(err) {
        console.error(err);
        let msg='Login failed';
        if(err.code==='auth/user-not-found'||err.code==='auth/wrong-password') msg='Invalid email or password';
        else if(err.code==='auth/too-many-requests') msg='Too many attempts, try after 5 min';
        else if(err.code==='auth/network-request-failed') msg='Network error';
        else if(err.code==='permission-denied') msg='Database access denied - Firebase rules need update';
        showError(msg); setLoading('login',false);
      }
    });

    window.forgotPassword = async function() {
      const email = prompt('Enter registered email:');
      if(!email) return;
      try { await sendPasswordResetEmail(auth,email); alert('✅ Reset link sent to '+email); }
      catch(e) { alert('❌ '+ (e.message||'Failed')); }
    }

    // Auto-redirect if already logged in
    onAuthStateChanged(auth, user => {
      if(user && localStorage.getItem('userSession')) window.location.href='index.html';
    });
  </script>
</body>
</html>
