<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <!-- Viewport-fit=cover is crucial for iOS notches and Android edge-to-edge screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMM Panel - WebApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#3b82f6', darkbg: '#0f172a', cardbg: 'rgba(30, 41, 59, 0.7)' } } }
    }
  </script>
  <style>
    body { 
      -webkit-tap-highlight-color: transparent; 
      /* Prevents content from hiding behind the fixed bottom navbar */
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
    }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .nav-active { color: #3b82f6; }
    .toast { transition: opacity 0.3s, transform 0.3s; }
    
    /* iOS Safe Area adjustments for the sticky bottom navbar */
    .safe-bottom-nav {
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-white select-none">

  <!-- Header -->
  <header class="p-4 flex justify-between items-center glass sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" class="w-10 h-10 rounded-full border-2 border-primary object-cover">
      <div>
        <h1 class="text-sm font-bold" id="user-name">Loading...</h1>
        <p class="text-xs text-gray-400">Balance: $<span id="user-balance" class="text-green-500 font-bold">0.00</span></p>
      </div>
    </div>
    <button id="theme-toggle" class="p-2 bg-gray-200 dark:bg-gray-800 rounded-full w-10 h-10 flex items-center justify-center transition">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <!-- Main Content Areas -->
  <main class="p-4">
    <!-- HOME TAB -->
    <section id="tab-home" class="space-y-6">
      <!-- Dashboard Stats -->
      <div class="grid grid-cols-2 gap-4">
        <div class="glass p-4 rounded-xl text-center shadow-sm">
          <i class="fa-solid fa-box text-primary text-xl mb-2"></i>
          <h2 class="text-2xl font-bold" id="stat-orders">0</h2>
          <p class="text-[11px] text-gray-400 uppercase tracking-wide mt-1">Total Orders</p>
        </div>
        <div class="glass p-4 rounded-xl text-center shadow-sm">
          <i class="fa-solid fa-eye text-green-500 text-xl mb-2"></i>
          <h2 class="text-2xl font-bold" id="stat-views">0</h2>
          <p class="text-[11px] text-gray-400 uppercase tracking-wide mt-1">Views Delivered</p>
        </div>
      </div>
      
      <button onclick="openModal('add-funds-modal')" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-wallet"></i> Add Funds
      </button>

      <!-- Services List -->
      <div>
        <h3 class="text-lg font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-fire text-orange-500"></i> Popular Services</h3>
        <div id="services-container" class="space-y-3">
          <!-- Services rendered via JS -->
          <div class="text-center text-gray-500 text-sm py-4"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        </div>
      </div>
    </section>

    <!-- ORDERS TAB -->
    <section id="tab-orders" class="hidden space-y-4">
      <h2 class="text-xl font-bold">Order History</h2>
      <div id="orders-container" class="space-y-3"></div>
    </section>

    <!-- REFER TAB -->
    <section id="tab-refer" class="hidden space-y-4">
      <div class="glass p-6 rounded-xl text-center space-y-4">
        <div class="w-16 h-16 bg-pink-500/10 rounded-full flex items-center justify-center mx-auto">
          <i class="fa-solid fa-gift text-3xl text-pink-500"></i>
        </div>
        <h2 class="text-xl font-bold">Refer & Earn</h2>
        <p class="text-sm text-gray-400">Invite friends and earn a bonus when they join!</p>
        <div class="bg-gray-200 dark:bg-slate-800 p-3 rounded-xl flex items-center justify-between border border-gray-300 dark:border-gray-700">
          <span id="ref-link" class="text-xs truncate w-3/4 select-all">Generating...</span>
          <button onclick="copyReferral()" class="text-primary p-2"><i class="fa-solid fa-copy"></i></button>
        </div>
        <p class="text-sm">Total Earnings: <span class="text-green-500 font-bold">$<span id="ref-earnings">0.00</span></span></p>
      </div>
    </section>
  </main>

  <!-- Bottom Navbar -->
  <nav class="fixed bottom-0 left-0 w-full glass flex justify-around pt-3 safe-bottom-nav z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800">
    <button onclick="switchTab('home')" class="nav-btn nav-active flex flex-col items-center gap-1 w-1/3">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-medium">Home</span>
    </button>
    <button onclick="switchTab('orders')" class="nav-btn text-gray-500 flex flex-col items-center gap-1 w-1/3">
      <i class="fa-solid fa-list-check text-lg"></i>
      <span class="text-[10px] font-medium">Orders</span>
    </button>
    <button onclick="switchTab('refer')" class="nav-btn text-gray-500 flex flex-col items-center gap-1 w-1/3">
      <i class="fa-solid fa-users text-lg"></i>
      <span class="text-[10px] font-medium">Refer</span>
    </button>
  </nav>

  <!-- Buy Service Modal (Fixed for Keyboard Overlap) -->
  <div id="buy-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center transition-opacity">
    <div class="glass w-full sm:w-96 rounded-t-3xl sm:rounded-2xl p-6 bg-white dark:bg-slate-800 space-y-4 transform transition-transform translate-y-full sm:translate-y-0 max-h-[90vh] overflow-y-auto" id="buy-modal-content">
      <div class="flex justify-between items-center pb-2 border-b border-gray-200 dark:border-gray-700">
        <h3 class="text-lg font-bold">Place Order</h3>
        <button onclick="closeModal('buy-modal')" class="text-gray-400 bg-gray-100 dark:bg-gray-700 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
      </div>
      <div id="selected-service-info" class="p-4 bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-200 rounded-xl text-sm border border-blue-100 dark:border-blue-800/50"></div>
      
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1">Target Link</label>
        <input type="url" id="order-link" placeholder="Enter Post/Profile Link" class="w-full p-3.5 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition text-sm" autocomplete="off">
      </div>
      
      <button id="confirm-buy-btn" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 transition">Pay & Order</button>
      <div class="pb-safe"></div> <!-- Extra padding for iOS keyboard -->
    </div>
  </div>

  <!-- Add Funds Modal -->
  <div id="add-funds-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="glass w-full max-w-sm rounded-2xl p-6 bg-white dark:bg-slate-800 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold">Add Funds</h3>
        <button onclick="closeModal('add-funds-modal')" class="text-gray-400"><i class="fa-solid fa-times"></i></button>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1">Amount ($)</label>
        <input type="number" id="fund-amount" placeholder="e.g. 10" class="w-full p-3.5 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-primary text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1">Payment Method</label>
        <select id="fund-method" class="w-full p-3.5 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-primary text-sm">
          <option value="Crypto">Crypto (USDT/TRX)</option>
          <option value="Card">Credit Card</option>
        </select>
      </div>
      <button onclick="submitDeposit()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition">Submit Request</button>
    </div>
  </div>

  <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-full shadow-xl opacity-0 pointer-events-none z-[60] flex items-center gap-2 text-sm font-medium"></div>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, updateDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBf0hHCtL3O5B7aUDN3Dj3OF_Dr_iKXfKc",
      authDomain: "test-834b0.firebaseapp.com",
      databaseURL: "https://test-834b0-default-rtdb.firebaseio.com",
      projectId: "test-834b0",
      storageBucket: "test-834b0.firebasestorage.app",
      messagingSenderId: "742456819850",
      appId: "1:742456819850:web:c302c9f1614f90d7b56d73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expands app to full screen

    // Global State
    let currentUser = null;
    let selectedService = null;
    let smmSettings = { api_url: "", api_key: "" };
    const BOT_USERNAME = "YourBotUsername";

    // Fake Live Counter
    setInterval(() => {
      let statElement = document.getElementById('stat-views');
      let current = parseInt(statElement.innerText.replace(/,/g, ''));
      statElement.innerText = (current + Math.floor(Math.random() * 10)).toLocaleString();
    }, 3000);

    // Initialization
    async function init() {
      const tgUser = tg.initDataUnsafe?.user || { id: "123456", first_name: "Test User", username: "tester" };
      document.getElementById('user-name').innerText = tgUser.first_name;
      if(tgUser.photo_url) document.getElementById('user-avatar').src = tgUser.photo_url;
      
      const userRef = doc(db, "users", tgUser.id.toString());
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        const startParam = tg.initDataUnsafe?.start_param || null;
        currentUser = {
          name: tgUser.first_name,
          username: tgUser.username || "",
          balance: 0,
          total_orders: 0,
          referral_earnings: 0,
          referred_by: startParam && startParam.startsWith('ref_') ? startParam.split('_')[1] : null,
          joined: serverTimestamp()
        };
        await setDoc(userRef, currentUser);
        
        if(currentUser.referred_by) {
            await addDoc(collection(db, "referrals"), { referrer: currentUser.referred_by, new_user: tgUser.id, timestamp: serverTimestamp() });
        }
      } else {
        currentUser = userSnap.data();
      }
      
      currentUser.id = tgUser.id.toString();
      updateDashboardUI();

      const settingsSnap = await getDoc(doc(db, "settings", "smm_api"));
      if(settingsSnap.exists()) smmSettings = settingsSnap.data();

      loadServices();
      document.getElementById('ref-link').innerText = `https://t.me/${BOT_USERNAME}?start=ref_${currentUser.id}`;
    }

    function updateDashboardUI() {
      document.getElementById('user-balance').innerText = parseFloat(currentUser.balance || 0).toFixed(2);
      document.getElementById('stat-orders').innerText = currentUser.total_orders || 0;
      document.getElementById('ref-earnings').innerText = parseFloat(currentUser.referral_earnings || 0).toFixed(2);
    }

    async function loadServices() {
      const q = query(collection(db, "services"));
      const snapshot = await getDocs(q);
      const container = document.getElementById('services-container');
      container.innerHTML = '';
      
      if(snapshot.empty) {
        container.innerHTML = '<div class="text-center text-gray-500 py-4 text-sm">No services available yet.</div>';
        return;
      }

      snapshot.forEach(doc => {
        const s = doc.data();
        s.id = doc.id;
        const icon = s.category === 'likes' ? 'fa-heart text-red-500 bg-red-100 dark:bg-red-900/30' : 
                     s.category === 'views' ? 'fa-eye text-blue-500 bg-blue-100 dark:bg-blue-900/30' : 
                     'fa-users text-green-500 bg-green-100 dark:bg-green-900/30';
        
        container.innerHTML += `
          <div class="glass p-4 rounded-xl flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center ${icon}">
                <i class="fa-solid ${icon.split(' ')[0]} text-lg"></i>
              </div>
              <div class="max-w-[150px] sm:max-w-[200px]">
                <h4 class="font-bold text-sm truncate">${s.name}</h4>
                <p class="text-xs text-gray-400 mt-0.5">${s.quantity} units • <span class="text-green-500 font-bold">$${s.price}</span></p>
              </div>
            </div>
            <button onclick="openBuyModal('${s.id}', '${s.name.replace(/'/g, "\\'")}', ${s.price}, '${s.smm_service_id}', ${s.quantity})" class="bg-primary/10 text-primary px-4 py-2 rounded-lg font-bold text-sm hover:bg-primary hover:text-white transition">Buy</button>
          </div>
        `;
      });
    }

    window.openBuyModal = (id, name, price, smm_id, qty) => {
      selectedService = { id, name, price, smm_id, qty };
      document.getElementById('selected-service-info').innerHTML = `
        <div class="flex justify-between items-center">
            <span class="font-bold">${name}</span>
            <span class="text-lg font-black text-primary">$${price}</span>
        </div>
        <div class="text-xs mt-1 text-blue-600 dark:text-blue-300">Quantity: ${qty}</div>
      `;
      document.getElementById('buy-modal-content').classList.remove('translate-y-full');
      document.getElementById('buy-modal').classList.remove('hidden');
    };

    document.getElementById('confirm-buy-btn').addEventListener('click', async () => {
      const link = document.getElementById('order-link').value;
      if(!link) return showToast('Please enter a valid link!', 'error');
      if(currentUser.balance < selectedService.price) return showToast('Insufficient balance!', 'error');

      const btn = document.getElementById('confirm-buy-btn');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`; 
      btn.disabled = true;

      try {
        currentUser.balance -= selectedService.price;
        currentUser.total_orders += 1;
        await updateDoc(doc(db, "users", currentUser.id), { balance: currentUser.balance, total_orders: currentUser.total_orders });
        updateDashboardUI();

        const orderRef = await addDoc(collection(db, "orders"), {
          user_id: currentUser.id, service_id: selectedService.id, service_name: selectedService.name,
          smm_service_id: selectedService.smm_id, quantity: selectedService.qty,
          link: link, price: selectedService.price, status: "Pending", timestamp: serverTimestamp()
        });

        let smm_order_id = null;
        let finalStatus = "Processing";

        if(smmSettings.api_url && smmSettings.api_key) {
           try {
              const apiRes = await fetch(smmSettings.api_url, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ key: smmSettings.api_key, action: "add", service: selectedService.smm_id, link: link, quantity: selectedService.qty })
              });
              const smmData = await apiRes.json();
              if(smmData.order) smm_order_id = smmData.order;
           } catch (e) {
              console.error("SMM API Error:", e);
           }
        }

        await updateDoc(orderRef, { status: finalStatus, external_order_id: smm_order_id });
        
        showToast('Order Placed Successfully!', 'success');
        closeModal('buy-modal');
        document.getElementById('order-link').value = '';
        if(document.getElementById('tab-orders').classList.contains('hidden') === false) loadOrders();
      } catch(e) {
        showToast('Error placing order', 'error');
        console.error(e);
      }
      btn.innerText = "Pay & Order"; btn.disabled = false;
    });

    window.submitDeposit = async () => {
      const amt = document.getElementById('fund-amount').value;
      const method = document.getElementById('fund-method').value;
      if(!amt || amt <= 0) return showToast('Invalid amount', 'error');

      await addDoc(collection(db, "transactions"), {
        user_id: currentUser.id, amount: parseFloat(amt), method: method, status: "Pending", timestamp: serverTimestamp()
      });
      showToast('Deposit request sent to admin!', 'success');
      closeModal('add-funds-modal');
      document.getElementById('fund-amount').value = '';
    };

    window.loadOrders = async () => {
      const q = query(collection(db, "orders"), where("user_id", "==", currentUser.id), orderBy("timestamp", "desc"));
      const snapshot = await getDocs(q);
      const container = document.getElementById('orders-container');
      container.innerHTML = '';
      
      if(snapshot.empty) {
        container.innerHTML = '<div class="text-center text-gray-500 py-10">No orders found.</div>';
        return;
      }

      snapshot.forEach(doc => {
        const o = doc.data();
        let badgeColor = o.status === 'Completed' ? 'bg-green-500/10 text-green-500 border border-green-500/20' : 
                         (o.status === 'Processing' ? 'bg-blue-500/10 text-blue-500 border border-blue-500/20' : 
                         'bg-orange-500/10 text-orange-500 border border-orange-500/20');
        
        container.innerHTML += `
          <div class="glass p-4 rounded-xl shadow-sm">
            <div class="flex justify-between items-start mb-2">
              <span class="font-bold text-sm max-w-[70%] leading-tight">${o.service_name}</span>
              <span class="px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${badgeColor}">${o.status}</span>
            </div>
            <div class="bg-gray-100 dark:bg-slate-900/50 p-2 rounded-lg mt-2">
                <p class="text-[11px] text-gray-500 truncate whitespace-nowrap overflow-hidden">🔗 <a href="${o.link}" target="_blank" class="text-blue-500 underline">${o.link}</a></p>
            </div>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-200 dark:border-gray-800">
                <p class="text-xs font-medium text-gray-500">Qty: <span class="text-gray-800 dark:text-gray-200">${o.quantity}</span></p>
                <p class="text-xs font-bold text-green-500">-$${o.price}</p>
            </div>
          </div>
        `;
      });
    };

    window.switchTab = (tab) => {
      ['home', 'orders', 'refer'].forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('nav-active'); btn.classList.add('text-gray-500');
      });
      event.currentTarget.classList.add('nav-active');
      event.currentTarget.classList.remove('text-gray-500');
      
      if(tab === 'orders') loadOrders();
    };

    window.openModal = (id) => {
      document.getElementById(id).classList.remove('hidden');
    }
    
    window.closeModal = (id) => {
      if(id === 'buy-modal') {
        document.getElementById('buy-modal-content').classList.add('translate-y-full');
      }
      setTimeout(() => {
        document.getElementById(id).classList.add('hidden');
      }, 150);
    };

    window.copyReferral = () => {
      navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
      showToast('Referral link copied!', 'success');
    };

    window.showToast = (msg, type) => {
      const t = document.getElementById('toast');
      t.innerHTML = type === 'success' ? `<i class="fa-solid fa-check-circle text-green-400"></i> ${msg}` : `<i class="fa-solid fa-circle-exclamation text-red-400"></i> ${msg}`;
      t.style.opacity = 1; t.style.transform = 'translate(-50%, 10px)';
      setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translate(-50%, -10px)'; }, 3000);
    };

    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    init();
  </script>
</body>
</html>
