<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCCQ8323U6o9UkptArtel1YNtV-BgaZQJQ",
        authDomain: "provider-46c14.firebaseapp.com",
        databaseURL: "https://provider-46c14-default-rtdb.firebaseio.com",
        projectId: "provider-46c14",
        storageBucket: "provider-46c14.firebasestorage.app",
        messagingSenderId: "1032460066158",
        appId: "1:1032460066158:web:8a52fb3c0651169c55f57f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            // Load Balance
            onValue(ref(db, `users/${user.uid}/balance`), (snap) => {
                const bal = snap.val() || 0;
                document.querySelectorAll('.text-gray-200').forEach(el => {
                    if(el.innerText.includes('₹')) el.innerText = '₹' + bal.toFixed(2);
                });
            });
        }
    });

    // Button Functions
    window.payNow = () => {
        const amt = document.getElementById('amountInput').value;
        if(amt < 20) return alert("Min ₹20");
        
        const utr = 'TXN' + Date.now();
        const upi = `upi://pay?pa=Paytmqr6i3w0w@ptys&pn=SACHIN%20SAYSING%20RAUT&am=${amt}&cu=INR&tr=${utr}`;
        const qr = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(upi)}&size=300x300`;

        document.getElementById('addFundsModal').querySelector('.relative').innerHTML = `
            <div class="text-center p-4">
                <h3 class="font-bold mb-4">Scan & Pay ₹${amt}</h3>
                <img src="${qr}" class="mx-auto w-48 mb-4 rounded-lg">
                <button onclick="confirmPay('${amt}', '${utr}')" class="w-full bg-green-500 py-3 rounded-xl font-bold">I Have Paid</button>
            </div>
        `;
    };

    window.confirmPay = (amt, utr) => {
        const user = auth.currentUser;
        push(ref(db, `deposits/${user.uid}`), {
            amount: parseFloat(amt),
            utr: utr,
            status: 'pending',
            time: Date.now()
        }).then(() => {
            alert("Sent for approval!");
            location.reload();
        });
    };
</script>
